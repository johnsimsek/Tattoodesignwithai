<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inky Vibes Tattoo - AI Design Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #10110f;
            /* Dark gradient background merging #10110f and #1E1D2B */
            background-image: radial-gradient(circle at top right, #1E1D2B, #10110f 60%);
            color: #ffffff;
            min-height: 100vh;
        }
        
        /* Liquid glass blur effect container */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* Subtle metallic gradients */
        .metallic-text {
            background: linear-gradient(to right, #e2e8f0, #94a3b8, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .metallic-btn {
            background: linear-gradient(135deg, #334155, #64748b, #334155);
            background-size: 200% 200%;
            transition: all 0.4s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .metallic-btn:hover {
            background-position: right center;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
        }
        
        .metallic-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Custom scrollbar for textarea */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        /* Spinner animation */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-left-color: #94a3b8;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
        }

        /* Modal styling */
        .modal-overlay {
            background: rgba(16, 17, 15, 0.8);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4 sm:p-8">

    <!-- Header Section -->
    <header class="text-center mb-8 max-w-2xl mx-auto w-full pt-4">
        <h1 class="text-4xl md:text-5xl font-bold mb-3 tracking-tight metallic-text">Inky Vibes Tattoo</h1>
        <p class="text-gray-400 text-sm md:text-base font-light">Bring your ideas to life with our AI tattoo concept generator.</p>
    </header>

    <!-- Main Generator Interface -->
    <main class="w-full max-w-xl mx-auto">
        <div class="glass-panel rounded-2xl p-6 md:p-8 mb-6 relative z-10">
            <div class="mb-5 flex justify-between items-end">
                <label for="promptInput" class="block text-sm font-medium text-gray-300">
                    Describe your tattoo idea
                </label>
                <span id="limitCounter" class="text-xs font-semibold text-gray-400 bg-black/30 px-2 py-1 rounded-md border border-white/5">
                    3/3 creations remaining
                </span>
            </div>
            
            <textarea 
                id="promptInput" 
                rows="4" 
                class="w-full bg-black/40 text-gray-100 placeholder-gray-500 rounded-xl p-4 outline-none border border-white/10 focus:border-gray-400 focus:ring-1 focus:ring-gray-400 transition-all resize-none shadow-inner"
                placeholder="e.g., 'I want a realistic rose and clock tattoo for my arm in black and grey...'"></textarea>
            
            <button 
                id="createBtn"
                class="mt-6 w-full metallic-btn text-white font-semibold py-3.5 px-6 rounded-xl flex items-center justify-center gap-2 group"
                onclick="generateTattoo()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 opacity-80 group-hover:opacity-100 transition-opacity" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                </svg>
                Create my tattoo
            </button>
        </div>

        <!-- Result Section (Initially hidden) -->
        <div id="resultArea" class="glass-panel rounded-2xl p-6 text-center hidden flex-col items-center justify-center min-h-[300px] mb-8">
            
            <!-- Loading State -->
            <div id="loadingState" class="flex flex-col items-center justify-center py-10 w-full hidden">
                <div class="spinner mb-4"></div>
                <p class="text-gray-400 text-sm animate-pulse">Consulting the AI artist... etching your concept...</p>
            </div>
            
            <!-- Image Result -->
            <div id="imageState" class="w-full hidden flex-col items-center">
                <div class="relative w-full rounded-xl overflow-hidden border border-white/10 bg-black/50 shadow-lg">
                    <img id="generatedImage" src="" alt="AI Generated Tattoo Concept" class="w-full h-auto object-contain max-h-[400px]">
                </div>
                
                <button 
                    id="downloadBtn"
                    class="mt-5 metallic-btn w-full sm:w-auto text-white font-medium py-2.5 px-8 rounded-xl flex items-center justify-center gap-2"
                    onclick="downloadImage()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    Download Design
                </button>
                
                <div class="mt-6 pt-4 border-t border-white/10 w-full">
                    <p class="text-xs text-gray-400 leading-relaxed max-w-sm mx-auto">
                        <span class="text-gray-300 font-medium">Note:</span> This is an AI-generated concept. The tattoo artist will refine and perfect this design for tattooing.
                    </p>
                </div>
            </div>
        </div>
    </main>

    <!-- Custom Message Box (Replaces alerts) -->
    <div id="messageBox" class="fixed inset-0 modal-overlay z-50 hidden flex-items-center justify-center p-4">
        <div class="glass-panel w-full max-w-sm rounded-2xl p-6 text-center transform transition-all scale-95 opacity-0 m-auto mt-[30vh]" id="messageBoxContent">
            <div class="w-12 h-12 rounded-full bg-black/30 border border-white/10 flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <h3 id="messageTitle" class="text-lg font-semibold text-white mb-2">Notification</h3>
            <p id="messageText" class="text-sm text-gray-400 mb-6"></p>
            <button onclick="closeMessageBox()" class="metallic-btn w-full py-2 rounded-lg text-sm font-medium">
                Got it
            </button>
        </div>
    </div>

    <script>
        // Constants & Config
        const DAILY_LIMIT = 3;
        const STORAGE_KEY = 'inkyVibes_tattoo_generations';
        const API_KEY = 'AQ.Ab8RN6KenqWe94NjezyWBMYQXLwNvYxbF7SIQjt-e3yNREw_ZQ'; // User provided API Key

        // DOM Elements
        const promptInput = document.getElementById('promptInput');
        const createBtn = document.getElementById('createBtn');
        const resultArea = document.getElementById('resultArea');
        const loadingState = document.getElementById('loadingState');
        const imageState = document.getElementById('imageState');
        const generatedImage = document.getElementById('generatedImage');
        const limitCounter = document.getElementById('limitCounter');
        
        // Modal Elements
        const messageBox = document.getElementById('messageBox');
        const messageBoxContent = document.getElementById('messageBoxContent');
        const messageTitle = document.getElementById('messageTitle');
        const messageText = document.getElementById('messageText');

        // Current image data for downloading
        let currentImageDataUrl = '';

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            updateLimitUI();
        });

        // Limit Management
        function getUsageData() {
            const today = new Date().toISOString().split('T')[0];
            let data = localStorage.getItem(STORAGE_KEY);
            
            if (data) {
                try {
                    const parsedData = JSON.parse(data);
                    if (parsedData.date === today) {
                        return parsedData;
                    }
                } catch (e) {
                    console.error("Error parsing local storage data", e);
                }
            }
            
            // Reset or initialize if new day or invalid data
            const newData = { date: today, count: 0 };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(newData));
            return newData;
        }

        function incrementUsage() {
            let usage = getUsageData();
            usage.count += 1;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(usage));
            updateLimitUI();
        }

        function updateLimitUI() {
            const usage = getUsageData();
            const remaining = Math.max(0, DAILY_LIMIT - usage.count);
            limitCounter.textContent = `${remaining}/${DAILY_LIMIT} creations remaining`;
            
            if (remaining === 0) {
                limitCounter.classList.remove('text-gray-400');
                limitCounter.classList.add('text-red-400', 'bg-red-900/20');
            } else {
                limitCounter.classList.add('text-gray-400');
                limitCounter.classList.remove('text-red-400', 'bg-red-900/20');
            }
        }

        // UI State Handlers
        function showMessage(title, text) {
            messageTitle.textContent = title;
            messageText.textContent = text;
            messageBox.classList.remove('hidden');
            messageBox.classList.add('flex');
            
            // Trigger animation
            setTimeout(() => {
                messageBoxContent.classList.remove('scale-95', 'opacity-0');
                messageBoxContent.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeMessageBox() {
            messageBoxContent.classList.remove('scale-100', 'opacity-100');
            messageBoxContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                messageBox.classList.add('hidden');
                messageBox.classList.remove('flex');
            }, 200);
        }

        // Generation Logic
        async function generateTattoo() {
            const description = promptInput.value.trim();
            
            if (!description) {
                showMessage("Missing Description", "Please describe your tattoo idea first.");
                return;
            }

            const usage = getUsageData();
            if (usage.count >= DAILY_LIMIT) {
                showMessage("Daily Limit Reached", "You have reached your limit of 3 creations for today. Please come back tomorrow for more ink inspiration!");
                return;
            }

            // Setup Loading UI
            createBtn.disabled = true;
            createBtn.innerHTML = '<span class="spinner w-4 h-4 mr-2 border-2"></span> Creating...';
            resultArea.classList.remove('hidden');
            resultArea.classList.add('flex');
            loadingState.classList.remove('hidden');
            imageState.classList.add('hidden');

            try {
                // Ensure good tattoo output by augmenting the prompt slightly
                const fullPrompt = `A high quality, professional tattoo flash design on a clean white background. Subject: ${description}. Clean lines, excellent contrast, clear for tattooing.`;

                const payload = {
                    contents: [{
                        role: 'user',
                        parts: [{ text: fullPrompt }]
                    }],
                    generationConfig: {
                        responseModalities: ['IMAGE'],
                        imageConfig: { aspectRatio: "1:1" }
                    },
                };

                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=${API_KEY}`;
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (response.ok && result.candidates && result.candidates.length > 0) {
                    const part = result.candidates[0].content?.parts?.find(p => p.inlineData);
                    
                    if (part && part.inlineData) {
                        // Success!
                        incrementUsage();
                        currentImageDataUrl = `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;
                        generatedImage.src = currentImageDataUrl;
                        
                        // Switch UI to show image
                        loadingState.classList.add('hidden');
                        imageState.classList.remove('hidden');
                        imageState.classList.add('flex');
                        
                        // Scroll to result smoothly
                        resultArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    } else {
                        throw new Error("No image data found in the response.");
                    }
                } else {
                    console.error("API Error Response:", result);
                    throw new Error("Failed to generate image. Please try adjusting your prompt.");
                }

            } catch (error) {
                console.error("Generation error:", error);
                loadingState.classList.add('hidden');
                resultArea.classList.add('hidden');
                resultArea.classList.remove('flex');
                showMessage("Generation Failed", "Sorry, we couldn't create your design. Please try again in a moment.");
            } finally {
                // Reset button state
                createBtn.disabled = false;
                createBtn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 opacity-80" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                    </svg>
                    Create my tattoo
                `;
            }
        }

        // Download Logic
        function downloadImage() {
            if (!currentImageDataUrl) {
                showMessage("Error", "No image available to download.");
                return;
            }
            
            // Create temporary link and trigger download
            const link = document.createElement('a');
            link.href = currentImageDataUrl;
            link.download = `inky-vibes-tattoo-${Date.now()}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
